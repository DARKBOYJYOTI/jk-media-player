name: Android build

# Manual only: nothing runs on push or pull request. Start a build from the Actions tab
# ("Run workflow") and choose the target.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build target'
        type: choice
        options:
          - debug
          - release
        default: debug
      release_tag:
        description: 'Release tag for release builds (for example v1.0.0). Ignored for debug.'
        required: false
        type: string

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug:
    name: Debug build
    if: ${{ inputs.build_type == 'debug' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: jk-media-player-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Signed release
    if: ${{ inputs.build_type == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "::error::release_tag is required for a release build (for example v1.0.0)."
            exit 1
          fi
          case "$RELEASE_TAG" in
            v*|[0-9]*) ;;
            *) echo "::error::release_tag must start with v or a digit."; exit 1 ;;
          esac

      # The keystore arrives as a secret, is written only to the runner's private temp directory,
      # and is deleted at the end of the job. Nothing is printed, so the base64 never reaches a log.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured for this repository."
            exit 1
          fi
          keystore="${RUNNER_TEMP}/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "JK_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          JK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${JK_KEYSTORE_PASSWORD:-}" ] || [ -z "${JK_KEY_ALIAS:-}" ] || [ -z "${JK_KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing secrets are incomplete."
            exit 1
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: jk-media-player-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: JK Media Player ${{ inputs.release_tag }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
